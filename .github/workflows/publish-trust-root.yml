name: publish-trust-root

# Trust-root publishing workflow.
#
# On push to main:
#   1. Validate each .well-known/*.json against its JSON Schema
#      (checked into schemas/trust-root/v1/ alongside the key material).
#   2. Recompute sha256 of each non-index .well-known file and
#      patch trust-root.json's resources[].sha256 in place.
#   3. Cosign sign each .well-known/*.json keyless via Sigstore (R4 keyless).
#   4. Commit the (possibly updated) trust-root.json and the new
#      *.bundle files back to main with [skip ci] to prevent loops.
#
# On pull request:
#   Validate only. No signing, no commit-back.
#
# R4 signing: uses cosign keyless (OIDC via GitHub Actions / Sigstore Fulcio).
# No long-lived signing secret is required.
#
# Identity: this workflow's OIDC subject is the Sigstore identity
# pinned by verifiers as R1_release_trust_root in
# atlasent-sigstore-identities.json.

on:
  push:
    branches: [main]
    paths:
      - '.well-known/**'
      - 'schemas/trust-root/**'
      - '.github/workflows/publish-trust-root.yml'
  pull_request:
    paths:
      - '.well-known/**'
      - 'schemas/trust-root/**'
      - '.github/workflows/publish-trust-root.yml'
  workflow_dispatch: {}

permissions:
  contents: write       # needed to commit bundle files back on push
  id-token: write       # needed for Sigstore keyless OIDC (R4)

concurrency:
  group: publish-trust-root
  cancel-in-progress: false

env:
  SCHEMA_DIR: schemas/trust-root/v1
  WELL_KNOWN_DIR: .well-known

jobs:
  validate:
    name: validate against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install check-jsonschema
        run: pipx install check-jsonschema

      - name: copy local schemas
        run: |
          set -euo pipefail
          mkdir -p .schemas
          for f in atlasent-trust-root atlasent-verifier-keys atlasent-revocations atlasent-sigstore-identities; do
            cp "${SCHEMA_DIR}/${f}.schema.json" ".schemas/${f}.schema.json"
          done
          ls -la .schemas/

      - name: validate each .well-known file
        run: |
          set -euo pipefail
          pairs=(
            "atlasent-trust-root"
            "atlasent-verifier-keys"
            "atlasent-revocations"
            "atlasent-sigstore-identities"
          )
          for name in "${pairs[@]}"; do
            f="${WELL_KNOWN_DIR}/${name}.json"
            s=".schemas/${name}.schema.json"
            echo "==> validating ${f} against ${s}"
            check-jsonschema --schemafile "${s}" "${f}"
          done

  sign-and-publish:
    name: sign and publish signatures
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: trust-root-publish
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull just enough history to push back to main.
          fetch-depth: 1

      # ── AtlaSent publish gate ────────────────────────────────────────
      # Dogfooding fix: this job used to auto-sign and republish the
      # trust root (the file every AtlaSent permit/audit signature is
      # verified against) on any push to main touching .well-known/**,
      # with no authorization check of any kind. This step closes that.
      #
      # Gate closed: if the permit is not verified, the job exits here
      # and nothing is recomputed, signed, or pushed.
      #
      # Action-type: `trust_root.publish` — a Canon specialization of
      # secret.rotate (CANON-000035), not production.deploy. A prior
      # version of this step used production.deploy (the same interim
      # choice atlasent-sdk's publishers use) gated against a demo org
      # whose production.deploy policy is a teaching scenario that can
      # never say allow — using it to gate a real release pipeline was a
      # category error. trust_root.publish is the semantically correct
      # action: secret.rotate already names "cert-manager / signing
      # pipelines: atlasent evaluate before key rollover" as its
      # integration point, and its authorization_pattern.
      # change_windows_required is false — this pipeline has no
      # application-deployment change window to be inside of, so unlike
      # an earlier draft of this gate, nothing here asserts one.
      # (artifact.release / CANON-000002 was considered and rejected for
      # now: it requires cryptographic requires_verified_actor + a
      # supply_chain assertion issuer, neither wired for any CI caller
      # org-wide yet. See atlasent/contract/canonical-actions/
      # SPECIALIZATIONS.yaml for the full specialization record.)
      #
      # Every context field below is REAL, not self-asserted:
      #   - repository/ref/sha/workflow are read by atlasent-action
      #     directly from the GitHub Actions environment and — as of
      #     atlasent-action's context-override fix — cannot be
      #     overridden by this step's own context input.
      #   - approvals is read by atlasent-action's default
      #     approvals-from: pr-reviews mode from a live GitHub API call
      #     against the merged PR's actual review state (see "AtlaSent:
      #     PR #N has N approving reviews" in a run's log). Nothing here
      #     asserts a literal approval count.
      #   - actor is the pipeline's own service/workflow identity
      #     (github-actions[bot], matching the allow_actors this org's
      #     trust_root.publish policy is narrowed to) — NOT
      #     ${{ github.actor }}. The human who triggered this run is
      #     recorded separately below as provenance context only; it is
      #     never the authorizing identity.
      #
      # Break-glass: no automatic bypass exists. If the AtlaSent API is
      # unreachable, trust-root publishing blocks by design — including
      # during an incident where a rotation is needed because something
      # was compromised. Emergency override is a reviewed PR that
      # temporarily removes this step, never a silent flag.
      #
      # Requires an `ATLASENT_API_KEY` secret (scopes: evaluate:write,
      # verify:execute) provisioned on the `trust-root-publish` GitHub
      # Environment above, from an org with trust_root.publish
      # provisioned (see atlasent-api migrations 20260848000000 /
      # 20260849000000).
      - name: AtlaSent publish gate
        uses: AtlaSent-Systems-Inc/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: trust_root.publish
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: github-actions[bot]
          target-id: atlasent-trust-root
          environment: production
          context: '{"artifact": "trust-root", "triggering_actor": "${{ github.actor }}"}'

      - name: Install cosign
        # R4 keyless: OIDC short-lived cert via Sigstore Fulcio. No private key.
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: install jq (preinstalled on ubuntu-latest, here for clarity)
        run: jq --version

      - name: recompute sha256s in trust-root index
        id: recompute
        run: |
          set -euo pipefail
          index="${WELL_KNOWN_DIR}/atlasent-trust-root.json"
          tmp="$(mktemp)"
          cp "${index}" "${tmp}"

          # For every resource entry, compute the live sha256 and patch
          # the entry in place. Resources whose path doesn't resolve to a
          # file under the repo root are a hard error.
          resources=$(jq -c '.resources[]' "${index}")
          while IFS= read -r entry; do
            path=$(echo "${entry}" | jq -r '.path')
            # paths in the index are absolute on the served host, e.g.
            # /.well-known/foo.json; strip the leading slash to map to repo.
            local_path="${path#/}"
            if [ ! -f "${local_path}" ]; then
              echo "ERROR: resource ${path} (expected at ${local_path}) does not exist" >&2
              exit 1
            fi
            real_sha=$(sha256sum "${local_path}" | awk '{print $1}')
            # Patch this entry's sha256 by editing the working file in place.
            # (Earlier this round-tripped through an `updated` var that was
            # reused as both filename and JSON content — so iteration 2+ passed
            # the JSON document as a filename to jq and died with "Could not
            # open file {...}". Operate on ${tmp} directly to avoid that.)
            jq --arg p "${path}" --arg s "${real_sha}" \
              '(.resources[] | select(.path == $p) | .sha256) = $s' "${tmp}" > "${tmp}.next"
            mv "${tmp}.next" "${tmp}"
          done <<< "${resources}"

          # Pretty-print and write back if changed.
          jq '.' "${tmp}" > "${index}.new"
          if ! cmp -s "${index}" "${index}.new"; then
            mv "${index}.new" "${index}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "trust-root index updated with recomputed sha256s"
          else
            rm "${index}.new"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "trust-root index sha256s already match"
          fi

      - name: sign each .well-known file (cosign keyless)
        # R4 keyless: --bundle only (Sigstore bundle v0.3 contains the cert,
        # Rekor entry, and detached signature — no separate .sig file needed).
        # COSIGN_YES=true suppresses the interactive confirmation prompt.
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          for f in "${WELL_KNOWN_DIR}"/*.json; do
            bundle="${f}.bundle"
            echo "==> signing ${f}"
            cosign sign-blob \
              --yes \
              --bundle "${bundle}" \
              "${f}"
          done
          ls -la "${WELL_KNOWN_DIR}"

      - name: commit updates back to main
        run: |
          set -euo pipefail
          git config user.name 'atlasent-trust-root-bot'
          git config user.email 'trust-root-bot@users.noreply.github.com'
          git add "${WELL_KNOWN_DIR}/"*.json "${WELL_KNOWN_DIR}/"*.bundle
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore(trust-root): refresh signatures and index hashes [skip ci]"
          git push
